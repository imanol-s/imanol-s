name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node --test scripts/site-checks.node-test.mjs scripts/resume-pipeline.check.mjs
      - name: Check preceding CI result
        id: previous
        if: github.event.action == 'synchronize'
        uses: actions/github-script@v7
        with:
          script: |
            const { previousChecksPassed } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/site-checks.mjs`);
            core.setOutput('passed', await previousChecksPassed(github, context));
      - name: Decide whether site checks are needed
        id: site
        env:
          CACHED_COMMIT_REF: ${{ github.event.action == 'synchronize' && github.event.before || github.event.pull_request.base.sha }}
          COMMIT_REF: ${{ github.event.pull_request.head.sha }}
          PREVIOUS_CHECKS_PASSED: ${{ steps.previous.outputs.passed }}
        run: |
          if [ "$PREVIOUS_CHECKS_PASSED" = true ] && node scripts/resume-pipeline.mjs ignore; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.site.outputs.build == 'true'
      - run: npm run test:git-identity
        if: steps.site.outputs.build == 'true'
      - run: npm run test
        if: steps.site.outputs.build == 'true'
      # Optimized images are content-addressed, so a partial restore is safe.
      - uses: actions/cache@v4
        if: steps.site.outputs.build == 'true'
        with:
          path: node_modules/.astro/assets
          key: astro-assets-${{ runner.os }}-${{ hashFiles('src/**/*.png', 'src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.webp', 'src/**/*.svg', 'astro.config.mjs', 'package-lock.json') }}
          restore-keys: astro-assets-${{ runner.os }}-
      - run: npm run build
        if: steps.site.outputs.build == 'true'
      - name: Read Playwright version
        id: playwright
        if: steps.site.outputs.build == 'true'
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        if: steps.site.outputs.build == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium webkit
        if: steps.site.outputs.build == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium webkit
        if: steps.site.outputs.build == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run test:e2e
        if: steps.site.outputs.build == 'true'

name: Publish resume

on:
  push:
    branches: [ui-migration]
    paths:
      - 'resume/**'
      - '.github/workflows/publish-resume.yml'
      - 'scripts/resume-pipeline.mjs'
      - 'scripts/resume-pipeline.check.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/ui-migration'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check pipeline rules
        run: node --test scripts/resume-pipeline.check.mjs
      - name: Compile with pdfLaTeX
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          working_directory: resume
          root_file: main.tex
          latexmk_use_lualatex: false
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Prepare PDF
        run: |
          test -s resume/main.pdf
          mkdir -p _site
          cp resume/main.pdf _site/resume.pdf
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Check current resume inputs
        id: freshness
        run: |
          git fetch origin +refs/heads/ui-migration:refs/remotes/origin/ui-migration
          node scripts/resume-pipeline.mjs fresh "$GITHUB_SHA" origin/ui-migration >> "$GITHUB_OUTPUT"
      - name: Deploy PDF
        if: steps.freshness.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
